name: V24.6.1 ULTIMATE OMNI-BOT

on:
  schedule:
    # Berjalan otomatis setiap 15 menit (Senin - Jumat)
    - cron: '*/15 * * * 1-5'
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual
    inputs:
      force_run:
        description: 'Paksa jalankan bot (Bypass Anti-Spam & Filters)?'
        required: false
        default: 'false'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Mengizinkan bot melakukan push/write commit ke repo
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true # Mempertahankan kredensial token untuk proses git push

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Quant Engine Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          DERIV_SYMBOL: ${{ vars.DERIV_SYMBOL || 'frxXAUUSD' }}
          MT5_OFFSET: ${{ vars.MT5_OFFSET || '0' }}
          DERIV_OFFSET: ${{ vars.DERIV_OFFSET || '0' }}
          BINANCE_OFFSET: ${{ vars.BINANCE_OFFSET || '0' }}
          YAHOO_OFFSET: ${{ vars.YAHOO_OFFSET || '-41.50' }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
        run: |
          echo "Memulai eksekusi bot pada waktu UTC: $(date -u)"
          python3 bot.py

      - name: Commit and Push Updated State Cache
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update V24.6.1 DNA & trade history [skip ci]"
          file_pattern: "**/*.json"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

name: V24.6.1 ULTIMATE OMNI-BOT

on:
  schedule:
    - cron: '7,22,37,52 * * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --no-cache-dir pytz requests pandas matplotlib websocket-client yfinance lxml beautifulsoup4

      - name: Run Bot V24.6.1
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DERIV_SYMBOL: ${{ secrets.DERIV_SYMBOL || 'frxXAUUSD' }}
          MT5_OFFSET: ${{ secrets.MT5_OFFSET || '0' }}
          DERIV_OFFSET: ${{ secrets.DERIV_OFFSET || '0' }}
          BINANCE_OFFSET: ${{ secrets.BINANCE_OFFSET || '0' }}
          YAHOO_OFFSET: ${{ secrets.YAHOO_OFFSET || '-36.50' }}
        run: |
          echo "Memulai eksekusi bot pada waktu UTC: $(date -u)"
          python3 bot.py

      - name: Commit DNA & Journal State
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update V24.6.1 DNA & trade history [skip ci]"
          file_pattern: "**/*.json"
          commit_options: "--no-verify"
